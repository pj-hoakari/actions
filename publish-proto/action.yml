name: Publish proto
description: Push the .proto files under a directory to GitHub Container Registry as an OCI artifact.

inputs:
    version:
        description: Version without the leading v (the version output of resolve-version).
        required: true
    tags:
        description: Comma-separated tags (the tags output of resolve-version).
        required: true
    artifact:
        description: Artifact name including the registry.
        required: false
        default: ghcr.io/${{ github.repository }}-proto
    proto-dir:
        description: Directory that holds the .proto files.
        required: false
        default: proto
    token:
        description: Token to log in to GitHub Container Registry.
        required: false
        default: ${{ github.token }}

runs:
    using: composite
    steps:
        - name: Set up mise
          uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
          with:
              install_args: oras

        - name: Log in to GitHub Container Registry
          shell: bash
          env:
              ACTOR: ${{ github.actor }}
              TOKEN: ${{ inputs.token }}
          run: printf '%s' "$TOKEN" | oras login ghcr.io -u "$ACTOR" --password-stdin

        - name: Push proto artifact
          shell: bash
          working-directory: ${{ inputs.proto-dir }}
          env:
              VERSION: ${{ inputs.version }}
              TAGS: ${{ inputs.tags }}
              ARTIFACT: ${{ inputs.artifact }}
          run: |
              set -euo pipefail

              mapfile -t FILES < <(find . -type f -name '*.proto' | sed 's|^\./||' | sort)
              if [ "${#FILES[@]}" -eq 0 ]; then
                echo "::error::公開対象の .proto ファイルが見つかりません"
                exit 1
              fi

              FILE_ARGS=()
              for f in "${FILES[@]}"; do
                FILE_ARGS+=("${f}:application/vnd.protobuf")
              done

              echo "publishing ${#FILES[@]} proto file(s) (tags: ${TAGS}):"
              printf '  %s\n' "${FILES[@]}"

              oras push \
                --artifact-type application/vnd.protobuf \
                --annotation "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
                --annotation "org.opencontainers.image.version=${VERSION}" \
                --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
                "${ARTIFACT}:${TAGS}" \
                "${FILE_ARGS[@]}"
