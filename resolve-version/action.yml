name: Resolve version
description: Resolve a vX.Y.Z(-suffix) version from the given input or the tag ref, check that its tag points at the current commit and is the latest version, and derive the tags to publish.

inputs:
    version:
        description: Version to publish. Falls back to the tag ref (release events, or workflow_dispatch on a tag).
        required: false
        default: ""

outputs:
    version:
        description: Version without the leading v.
        value: ${{ steps.resolve.outputs.version }}
    tags:
        description: Comma-separated tags (version, sha-<short sha>, latest when not a pre-release).
        value: ${{ steps.resolve.outputs.tags }}

runs:
    using: composite
    steps:
        - name: Resolve version
          id: resolve
          shell: bash
          env:
              INPUT_VERSION: ${{ inputs.version }}
          run: ${{ github.action_path }}/resolve-version.sh
