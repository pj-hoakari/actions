name: Go lint
description: Install golangci-lint with mise, run it with --fix on a job with Go set up, and hand the fixes to autofix.ci. The calling workflow must be named autofix.ci.

inputs:
    commit-message:
        description: Commit message for the autofix.ci fixes.
        required: false
        default: ""

runs:
    using: composite
    steps:
        - name: Set up mise
          uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
          with:
              install_args: golangci-lint

        - name: Run golangci-lint
          uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
          with:
              install-mode: none
              args: --fix

        - name: Hand fixes to autofix.ci
          uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
          with:
              commit-message: ${{ inputs.commit-message }}
