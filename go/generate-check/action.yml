name: Go generate check
description: Run go generate on a job with Go set up, and fail when the working tree changes.

runs:
    using: composite
    steps:
        - name: Run generators
          shell: bash
          run: go generate ./...

        - name: Verify generated code is up to date
          shell: bash
          run: |
              if [ -n "$(git status --porcelain)" ]; then
                echo "::error::go generate の実行後に未コミットの差分があります"
                git status --short
                git diff
                exit 1
              fi
