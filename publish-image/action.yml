name: Publish image
description: Build a multi-arch image and push it to GitHub Container Registry with semver tags.

inputs:
    version:
        description: Version without the leading v (the version output of resolve-version).
        required: true
    image:
        description: Image name including the registry.
        required: false
        default: ghcr.io/${{ github.repository }}
    target:
        description: Dockerfile build stage.
        required: false
        default: ""
    file:
        description: Path to the Dockerfile.
        required: false
        default: ./Dockerfile
    cache-scope:
        description: GitHub Actions cache scope for the build.
        required: false
        default: buildkit
    token:
        description: Token to log in to GitHub Container Registry.
        required: false
        default: ${{ github.token }}

runs:
    using: composite
    steps:
        - name: Set up QEMU
          uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
          with:
              platforms: arm64

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

        - name: Log in to GitHub Container Registry
          uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
          with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ inputs.token }}

        - name: Extract metadata
          id: meta
          uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
          with:
              images: ${{ inputs.image }}
              tags: |
                  type=semver,pattern={{version}},value=${{ inputs.version }}
                  type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
                  type=semver,pattern={{major}},value=${{ inputs.version }},enable=${{ !startsWith(inputs.version, '0.') }}
                  type=raw,value=latest,enable=${{ !contains(inputs.version, '-') }}

        - name: Build and push
          uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
          with:
              context: .
              file: ${{ inputs.file }}
              target: ${{ inputs.target }}
              platforms: linux/amd64,linux/arm64
              push: true
              tags: ${{ steps.meta.outputs.tags }}
              labels: ${{ steps.meta.outputs.labels }}
              cache-from: type=gha,scope=${{ inputs.cache-scope }}
              cache-to: type=gha,mode=max,scope=${{ inputs.cache-scope }}
              provenance: true
              sbom: true
