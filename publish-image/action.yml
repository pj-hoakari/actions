name: Publish image
description: Build an image and push it to GitHub Container Registry with the sha tag, plus version and latest tags when a version is given.

inputs:
    version:
        description: Version without the leading v (the version output of resolve-version). Empty to push only the sha tag.
        required: false
        default: ""
    sha:
        description: Commit the image is built from. Defaults to the triggering commit.
        required: false
        default: ""
    platforms:
        description: Target platforms.
        required: false
        default: linux/amd64,linux/arm64
    image:
        description: Image name including the registry.
        required: false
        default: ghcr.io/${{ github.repository }}
    target:
        description: Dockerfile build stage.
        required: false
        default: ""
    file:
        description: Path to the Dockerfile.
        required: false
        default: ./Dockerfile
    cache-scope:
        description: GitHub Actions cache scope for the build.
        required: false
        default: buildkit
    secrets:
        description: Build secrets exposed to the Dockerfile as BuildKit secret mounts, one id=value per line.
        required: false
        default: ""
    token:
        description: Token to log in to GitHub Container Registry.
        required: false
        default: ${{ github.token }}

runs:
    using: composite
    steps:
        - name: Set up QEMU
          if: contains(inputs.platforms, 'arm64')
          uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
          with:
              platforms: arm64

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

        - name: Log in to GitHub Container Registry
          uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
          with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ inputs.token }}

        - name: Resolve tags
          id: tags
          shell: bash
          env:
              VERSION: ${{ inputs.version }}
              SHA: ${{ inputs.sha || github.sha }}
          run: ${{ github.action_path }}/resolve-tags.sh

        - name: Extract metadata
          id: meta
          uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
          with:
              images: ${{ inputs.image }}
              tags: ${{ steps.tags.outputs.tags }}
              labels: org.opencontainers.image.revision=${{ inputs.sha || github.sha }}

        - name: Build and push
          uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
          with:
              context: .
              file: ${{ inputs.file }}
              target: ${{ inputs.target }}
              platforms: ${{ inputs.platforms }}
              push: true
              tags: ${{ steps.meta.outputs.tags }}
              labels: ${{ steps.meta.outputs.labels }}
              secrets: ${{ inputs.secrets }}
              cache-from: type=gha,scope=${{ inputs.cache-scope }}
              cache-to: type=gha,mode=max,scope=${{ inputs.cache-scope }},ignore-error=true
              provenance: true
              sbom: true
